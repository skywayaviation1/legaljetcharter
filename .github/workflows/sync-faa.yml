name: Sync FAA operator data

on:
  schedule:
    # Daily at 12:15 UTC. Both FAA sources are described as weekly.
    # A daily check is what notices a new file without anyone watching the page.
    - cron: "15 12 * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

concurrency:
  group: faa-sync
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r scripts/requirements.txt
      - run: python3 scripts/test_sync.py

  sync:
    # Pull requests only run the tests above. explore.dot.gov answers 403 to
    # GitHub-hosted addresses, so this job is the daily/manual check. Set the
    # FAA_RUNNER repository variable to a self-hosted runner label if the
    # default runner is refused.
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.FAA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r scripts/requirements.txt
      - name: Sync FAA sources
        run: python3 scripts/sync_faa.py
      - name: Upload sync summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faa-sync-summary
          path: .sync-summary.json
          if-no-files-found: ignore
      - name: Commit when the check finished
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operators.json data/meta.json data/sources/part135.json data/sources/air-operator.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          if git diff --cached --quiet -- data/operators.json data/sources/part135.json data/sources/air-operator.json; then
            msg="chore: record FAA check, source files unchanged"
          else
            msg="data: sync FAA Part 135 operator lists"
          fi
          git commit -m "$msg"
          git push
