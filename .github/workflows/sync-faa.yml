name: Sync FAA operator data

on:
  schedule:
    # Daily at 12:15 UTC. The FAA says both sources are updated weekly;
    # a daily check is what notices a new file without anyone watching the page.
    - cron: "15 12 * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

concurrency:
  group: faa-sync
  cancel-in-progress: false

jobs:
  sync:
    # explore.dot.gov (Akamai) refuses the Linux GitHub runner IPs.
    # macOS runners are on a different network and can open the Air Operator workbook.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chrome
        run: brew install --cask google-chrome

      - name: Install sync dependencies
        run: |
          python3 -m pip install -r scripts/requirements.txt
          npm install --prefix scripts

      - name: Sync FAA sources
        env:
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: python3 scripts/sync_faa.py

      - name: Upload sync summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faa-sync-summary
          path: .sync-summary.json
          if-no-files-found: ignore

      - name: Upload dataset from a pull request run
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: faa-dataset
          path: |
            data/operators.json
            data/meta.json
            data/sources/part135.json
            data/sources/air-operator.json

      - name: Commit when the check finished
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/operators.json data/meta.json data/sources/part135.json data/sources/air-operator.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          if git diff --cached --quiet -- data/operators.json data/sources/part135.json data/sources/air-operator.json; then
            msg="chore: record FAA check, source files unchanged"
          else
            msg="data: sync FAA Part 135 operator lists"
          fi
          git commit -m "$msg"
          git push
