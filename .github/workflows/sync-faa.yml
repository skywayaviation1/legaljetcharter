name: Sync FAA operator data

on:
  schedule:
    # Daily at 12:15 UTC. Both FAA sources are described as weekly.
    # A daily check is what notices a new file without anyone watching the page.
    - cron: "15 12 * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

concurrency:
  group: faa-sync
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r scripts/requirements.txt
      - run: python3 scripts/test_sync.py
      - run: python3 scripts/test_safety.py

  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r scripts/requirements.txt
      - name: Download NTSB and FAA enforcement sources
        run: python3 scripts/safety.py

  sync:
    # Pull requests run the tests only. This job is the daily check and any
    # manual run. GitHub-hosted runners are refused by explore.dot.gov even
    # in real Chrome, so set FAA_RUNNER to a self-hosted label (Jake's Mac).
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.FAA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # GitHub-hosted Ubuntu already has a writable hosted tool cache.
      - uses: actions/setup-python@v5
        if: runner.os != 'macOS'
        with:
          python-version: "3.12"
      # On Jake's Mac, setup-python's macOS installer creates
      # /Users/runner/hostedtoolcache (permission denied; the runner home is
      # /Users/jakecambria/actions-runner) and then sudo-installs a framework.
      # uv puts CPython under the runner work directory instead. No Homebrew
      # and no Xcode command-line tools.
      - name: Install Python 3.12 on macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) triple=aarch64-apple-darwin ;;
            x86_64) triple=x86_64-apple-darwin ;;
            *) echo "No uv build for $(uname -m)"; exit 1 ;;
          esac
          tool="${RUNNER_WORKSPACE%/*}/_tool"
          uvroot="$tool/uv-0.9.5"
          if [ ! -x "$uvroot/uv" ]; then
            mkdir -p "$uvroot"
            tmp="$(mktemp -d)"
            curl -fsSL -o "$tmp/uv.tgz" "https://github.com/astral-sh/uv/releases/download/0.9.5/uv-${triple}.tar.gz"
            tar -xzf "$tmp/uv.tgz" -C "$uvroot" --strip-components=1
          fi
          export UV_PYTHON_INSTALL_DIR="$tool/python"
          "$uvroot/uv" python install 3.12
          py="$("$uvroot/uv" python find 3.12)"
          bindir="$tool/bin"
          mkdir -p "$bindir"
          ln -sfn "$py" "$bindir/python3"
          ln -sfn "$py" "$bindir/python"
          echo "$bindir" >> "$GITHUB_PATH"
          echo "$uvroot" >> "$GITHUB_PATH"
          echo "AGENT_TOOLSDIRECTORY=$tool" >> "$GITHUB_ENV"
          echo "RUNNER_TOOL_CACHE=$tool" >> "$GITHUB_ENV"
          "$bindir/python3" -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.executable)'
      - name: Use the job Python, not the macOS stub
        run: |
          exe="$(python3 -c 'import sys; print(sys.executable)')"
          echo "Python: $exe"
          case "$exe" in
            /usr/bin/python3)
              echo "python3 is still /usr/bin/python3, the macOS stub. The job did not install its own Python."
              exit 1
              ;;
          esac
      # The uv-managed CPython has no ensurepip, so `python3 -m venv` exits 1.
      # Install uv when it is not already on PATH, then build the venv with uv.
      # Ubuntu gets the same path. The stdlib venv is only a fallback.
      - name: Create a virtualenv and install packages
        run: |
          set -euo pipefail
          echo "which python3: $(command -v python3)"
          python3 --version
          if ! command -v uv >/dev/null 2>&1; then
            echo "which uv: not on PATH; installing"
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="${HOME}/.local/bin:${PATH}"
            echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          fi
          echo "which uv: $(command -v uv)"
          uv --version
          if command -v uv >/dev/null 2>&1; then
            uv venv --python 3.12 "$RUNNER_TEMP/venv"
            uv pip install --python "$RUNNER_TEMP/venv/bin/python" -r scripts/requirements.txt
          elif python3 -m venv "$RUNNER_TEMP/venv"; then
            "$RUNNER_TEMP/venv/bin/python" -m pip install -r scripts/requirements.txt
          else
            python3 -m venv --without-pip "$RUNNER_TEMP/venv"
            curl -fsSL https://bootstrap.pypa.io/get-pip.py | "$RUNNER_TEMP/venv/bin/python"
            "$RUNNER_TEMP/venv/bin/python" -m pip install -r scripts/requirements.txt
          fi
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -c "import playwright, openpyxl, access_parser; print('packages ok')"
      - name: Confirm Chrome on macOS
        if: runner.os == 'macOS'
        run: |
          chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          test -x "$chrome"
          echo "Chrome: $chrome"
      - name: Install Google Chrome and a virtual display
        if: runner.os == 'Linux'
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/chrome.deb xvfb
      - name: Sync FAA sources
        if: runner.os == 'Linux'
        run: xvfb-run -a python3 scripts/sync_faa.py
      # Headless Chrome on Jake's Mac is refused by Akamai (HTTP 403). A normal
      # visible window loads the FAA page and the Tableau view, so this step
      # must stay headed and must use the Chrome app in /Applications.
      - name: Sync FAA sources on macOS
        if: runner.os == 'macOS'
        env:
          FAA_CHROME_HEADED: "1"
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: python3 scripts/sync_faa.py
      - name: Upload sync summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faa-sync-summary
          path: .sync-summary.json
          if-no-files-found: ignore
      - name: Commit when the check finished
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git add data/operators.json data/meta.json data/sources/part135.json data/sources/air-operator.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          if git diff --cached --quiet -- data/operators.json data/sources/part135.json data/sources/air-operator.json; then
            msg="chore: record FAA check, source files unchanged"
          else
            msg="data: sync FAA Part 135 operator lists"
          fi
          # A self-hosted Mac may sign commits or use the keychain. Checkout
          # already stored one Authorization header; a second extraheader makes
          # GitHub reject the push with "Duplicate header".
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              -c commit.gpgsign=false \
              commit --no-verify -m "$msg"
          git -c credential.helper= push origin "HEAD:${GITHUB_REF_NAME}"
